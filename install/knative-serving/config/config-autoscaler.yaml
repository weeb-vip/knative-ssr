apiVersion: v1
kind: ConfigMap
metadata:
  name: config-autoscaler
  namespace: knative-serving
  labels:
    serving.knative.dev/release: devel
data:
  # Cluster-wide autoscaler defaults. Per-service annotations in the Helm chart
  # override these; these are the fallbacks for anything deployed without them.

  enable-scale-to-zero: "true"

  # How long a revision must be idle before it is scaled away. Short values look
  # efficient and feel terrible — every lull becomes a cold start for the next
  # visitor. The edge cache absorbs most of that, but not a miss.
  scale-to-zero-grace-period: "60s"
  scale-to-zero-pod-retention-period: "5m"

  # SSR is CPU-bound and Node is single-threaded, so the upstream default of 100
  # concurrent requests per pod is far too optimistic — it queues work behind the
  # event loop instead of adding a pod.
  container-concurrency-target-default: "50"
  container-concurrency-target-percentage: "70"

  # Window over which concurrency is averaged. Shorter reacts faster to bursts
  # and flaps more.
  stable-window: "60s"
  panic-window-percentage: "10.0"
  panic-threshold-percentage: "200.0"

  max-scale-up-rate: "1000.0"
  max-scale-down-rate: "2.0"
