name: CI

on:
  pull_request:
  # Merges to main run these through release.yml, which gates the release on
  # them. A push trigger here would duplicate the whole suite on every merge.
  workflow_call:

jobs:
  edge:
    name: Edge proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: edge/go.sum
      - run: go vet ./...
        working-directory: edge
      # Covers the key format, the storage policy and segment isolation, and
      # asserts spec/key-vectors.json is current.
      - run: go test ./...
        working-directory: edge

  spec:
    name: Cache-key spec is committed current
    runs-on: ubuntu-latest
    # The published spec is what every adapter tests against. If it drifts from
    # the implementation here, adapters validate against a lie.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: edge/go.sum
      - run: go test ./... -run TestSpecVectors -update
        working-directory: edge
      - name: Spec must already be up to date
        run: |
          if ! git diff --exit-code spec/key-vectors.json; then
            echo "::error::spec/key-vectors.json is stale. Regenerate with:"
            echo "  cd edge && go test ./... -run TestSpecVectors -update"
            echo "and bump SpecVersion if the key format itself changed."
            exit 1
          fi

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - run: |
          helm lint charts/ssr-knative \
            --set ssr.image.repository=example/app \
            --set ssr.image.tag=1.0.0 \
            --set istio.host=app.example.com

      - name: Worked examples must render
        run: |
          for f in charts/ssr-knative/examples/*.yaml; do
            echo "--- $f"
            helm template app charts/ssr-knative -n web -f "$f" \
              --set ssr.image.tag=ci > /dev/null
          done

      - name: Render without the edge tier
        run: |
          helm template app charts/ssr-knative -n web \
            --set ssr.image.repository=example/app \
            --set ssr.image.tag=ci \
            --set istio.host=app.example.com \
            --set edge.enabled=false \
            --set ssr.autoscaling.minScale=1 > /dev/null

      - name: Render with an external Redis
        run: |
          helm template app charts/ssr-knative -n web \
            --set ssr.image.repository=example/app \
            --set ssr.image.tag=ci \
            --set istio.host=app.example.com \
            --set redis.enabled=false \
            --set redis.external=redis://elsewhere:6379 > /dev/null

      - name: Required values must fail loudly
        run: |
          if helm template app charts/ssr-knative -n web > /dev/null 2>&1; then
            echo "::error::chart rendered with no image or host set"
            exit 1
          fi

  release-script:
    name: Version stamping
    runs-on: ubuntu-latest
    # scripts/set-version.sh only runs during a release, so without this job its
    # first execution would be the one that matters. It edits the chart with
    # sed, which means restructuring values.yaml can silently stop it matching —
    # and the symptom is a release whose chart still names the previous image.
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Stamps the chart
        run: |
          ./scripts/set-version.sh 9.9.9

          grep -qx 'version: 9.9.9'      charts/ssr-knative/Chart.yaml
          grep -qx 'appVersion: "9.9.9"' charts/ssr-knative/Chart.yaml
          grep -qF '    tag: "9.9.9"'    charts/ssr-knative/values.yaml

      - name: Leaves the consumer's own image alone
        # ssr.image.tag sits at the same indentation as the edge tag and is the
        # single easiest thing for a broadened sed to clobber. It must stay
        # empty so the chart keeps rejecting a deployment that forgot to set it.
        run: |
          if ! grep -qF 'tag: ""' charts/ssr-knative/values.yaml; then
            echo '::error::set-version.sh overwrote ssr.image.tag'
            exit 1
          fi
          if helm template app charts/ssr-knative -n web > /dev/null 2>&1; then
            echo '::error::chart no longer requires ssr.image.tag after stamping'
            exit 1
          fi

      - name: Stamped chart still renders
        run: |
          helm lint charts/ssr-knative \
            --set ssr.image.repository=example/app \
            --set ssr.image.tag=1.0.0 \
            --set istio.host=app.example.com

          helm template app charts/ssr-knative -n web \
            --set ssr.image.repository=example/app \
            --set ssr.image.tag=ci \
            --set istio.host=app.example.com \
          | grep -qF ':9.9.9' || {
              echo '::error::stamped edge tag did not reach the rendered manifests'
              exit 1
            }
          # ssr.image.tag is pinned to `ci` in that render, so the only way
          # :9.9.9 appears is the edge image the script just stamped. Asserting
          # on the tag rather than a full image string keeps this from breaking
          # if the default edge repository is ever changed.

      - name: Refuses to stamp without a version
        run: |
          if ./scripts/set-version.sh 2>/dev/null; then
            echo '::error::set-version.sh accepted an empty version'
            exit 1
          fi

  image:
    name: Build edge image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: edge
          push: false
          tags: edge-cache:ci
