{{- if .Values.appConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "weeb-ssr.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weeb-ssr.labels" . | nindent 4 }}
data:
  config.json: |
    {{- .Values.appConfig.data | toPrettyJson | nindent 4 }}
{{- end }}
