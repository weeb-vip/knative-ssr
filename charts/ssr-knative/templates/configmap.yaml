{{- if .Values.configFile.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssr-knative.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssr-knative.labels" . | nindent 4 }}
data:
  {{ .Values.configFile.filename }}: |
    {{- .Values.configFile.data | toPrettyJson | nindent 4 }}
{{- end }}
